version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # @marp-team/marp-core が katex@^0.18.2 を peer 依存として要求しており、
      # 0.19 以上では npm ci が ERESOLVE で失敗するため除外する。
      # marp-core が katex 0.19 に対応したら、この ignore を削除すること。
      - dependency-name: "katex"
        versions: [">=0.19.0"]
