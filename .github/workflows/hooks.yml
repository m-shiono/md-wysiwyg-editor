name: Hooks

on:
  push:
    paths:
      - ".cursor/hooks/**"
      - ".github/workflows/hooks.yml"
  pull_request:
    paths:
      - ".cursor/hooks/**"
      - ".github/workflows/hooks.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run hook unit tests
        run: python3 .cursor/hooks/test_workflow_state.py -v

      - name: Run hook E2E tests
        run: python3 .cursor/hooks/test_gate_e2e.py -v

      - name: Run doc link tests
        run: python3 .cursor/hooks/test_doc_links.py -v

      - name: Run doc drift tests
        run: python3 .cursor/hooks/test_doc_drift.py -v
