name: Package VSIX

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref_note:
        description: 'Optional note for this build (shown in run summary)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  package:
    name: Build and upload VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit

      - name: Install xvfb (for VS Code integration tests)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Package VSIX
        env:
          SOURCEMAP: '0'
        run: |
          npm run compile
          rm -f dist/*.map media/*.map
          npx vsce package --out "md-wysiwyg-editor-${{ github.sha }}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: md-wysiwyg-editor-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          {
            echo "## VSIX package"
            echo ""
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Note:** ${{ inputs.ref_note || '(none)' }}"
            echo "- **Checks:** lint, typecheck, unit, integration (xvfb), vsce package"
            echo ""
            echo "Download the artifact **md-wysiwyg-editor-vsix** from this run page."
            echo ""
            echo "Install locally:"
            echo '```bash'
            echo "code --install-extension md-wysiwyg-editor-*.vsix"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
