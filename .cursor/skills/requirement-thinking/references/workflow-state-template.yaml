# SDD phase tracker — write to temporary/workflow-state-<task-id>.yaml
# Created at requirement-thinking requirements-phase completion (Middle / Large).
# Phase C done, or Phase C skipped after Advisor Defaults confirmation.
# Updated on disk via .cursor/hooks/update-workflow-state.py (handoff alone is insufficient).

task_id: <slug>
triage: middle  # trivial | small | middle | large
feature_slug: <slug>  # matches doc/testspec-<feature_slug>.md

phases:
  requirements: done
  spec: pending
  testspec: pending
  tests: pending
  implementation: pending
  review: pending

gates:
  requirements: pending  # verifier requirements-gate-check sets done
  spec: pending
  testspec: pending

artifacts:
  intent_brief: temporary/intent-brief-<task-id>.md
  requirements_brief: temporary/requirements-brief-<task-id>.md
  systemspec_section: null
  testspec: null

bypass:
  reason: null  # e.g. refactor-no-behavior-change — skips testspec/tests gates for build-agent

tdd_loop:
  iteration: 0
  max: 3
  status: pending  # pending | green | blocked
  last_failure: null
