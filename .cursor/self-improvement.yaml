feedback:
  mode: local_markdown
  path: .triage/reports/self-retrospective.md
  label: skill-retrospective

targets:
  rules:
    - .cursor/rules/project-conventions.mdc
    - .cursor/rules/orchestrator.mdc
    - .cursor/rules/README.md
  skills:
    - .cursor/skills/_shared/read-stack.md
    - .cursor/skills/_shared/review-lifecycle.md
    - .cursor/skills/_shared/update-workflow-state.md
    - .cursor/skills/requirements-gate-check/SKILL.md
    - .cursor/skills/spec-gate-check/SKILL.md
    - .cursor/skills/testspec-gate-check/SKILL.md
    - .cursor/skills/tdd-red-green-loop/SKILL.md
    - .cursor/skills/requirement-thinking/SKILL.md
    - .cursor/skills/requirement-thinking/references/workflow-state-template.yaml
    - .cursor/skills/requirements-advisory/SKILL.md
    - .cursor/skills/project-debugging/SKILL.md
    - .cursor/skills/project-implementation/SKILL.md
    - .cursor/skills/project-refactoring/SKILL.md
    - .cursor/skills/project-code-review/SKILL.md
    - .cursor/skills/project-security-review/SKILL.md
    - .cursor/skills/project-design-review/SKILL.md
    - .cursor/skills/project-self-retrospective/SKILL.md
    - .cursor/skills/project-skill-triage/SKILL.md
  agents:
    - .cursor/agents/requirements-agent.md
    - .cursor/agents/spec-agent.md
    - .cursor/agents/test-agent.md
    - .cursor/agents/build-agent.md
    - .cursor/agents/review-agent.md
    - .cursor/agents/verifier.md
    - .cursor/agents/meta-agent.md
    - .cursor/agents/handoff-template.md
  templates:
    - templates/README.md
  hooks:
    - .cursor/hooks.json
    - .cursor/hooks/README.md
    - .cursor/hooks/gate-requirements-workflow.py
    - .cursor/hooks/gate-specification-workflow.py
    - .cursor/hooks/gate-verifier-workflow.py
    - .cursor/hooks/archive-workflow-state.py
    - .cursor/hooks/init-workflow-state.py
    - .cursor/hooks/update-workflow-state.py
    - .cursor/hooks/session-requirements-reminder.sh

signals:
  - user_correction
  - repeated_instruction
  - step_loop
  - review_root_cause
  - subagent_handoff_failure

limits:
  max_findings_per_run: 5
  min_evidence_lines: 1
  require_sanitized_output: true
